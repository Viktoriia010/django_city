<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Головна — Ужгород</title>
    <meta name="description" content="Інформаційний сайт про місто Ужгород">
    <link rel="preconnect" href="https://images.unsplash.com">
    <style>
        :root {
            --ink: #493844;
            --muted: #8e7d89;
            --cream: #fff8fa;
            --white: #ffffff;
            --green: #b87598;
            --mint: #f7e5ee;
            --gold: #d9a8bd;
            --line: #f0dce6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui,
            -apple-system, "Segoe UI", sans-serif;
            line-height: 1.65;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrap {
            width: min(1120px, calc(100% - 40px));
            margin: auto;
        }

        header {
            padding: 22px 0;
            background: rgba(255, 248, 250, 0.92);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 5;
            backdrop-filter: blur(12px);
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: -0.04em;
            font-size: 1.2rem;
        }

        .mark {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: #c58aa8;
            color: white;
            display: grid;
            place-items: center;
            font-size: 1.35rem;
        }

        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            font-size: 0.9rem;
            color: var(--muted);
            padding: 9px 13px;
            border-radius: 999px;
            transition: 0.25s ease;
        }

        nav a:hover,
        nav a.active {
            background: #f3dce8;
            color: #9d5f82;
        }

        .hero-img {
    position: relative;
    width: 100%;
    height: 350px;
    overflow: hidden;
}

.hero-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.hero-img::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        180deg,
        rgba(20,42,33,.02),
        rgba(20,42,33,.28)
    );
}

.photo-note {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 2;
    color: white;
    font-size: 20px;
}
        .hero {
            padding: 70px 0 52px;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 42px;
            align-items: center;
        }

        .eyebrow {
            color: #b87598;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2.7rem, 6vw, 5.2rem);
            line-height: 1.02;
            letter-spacing: -0.065em;
            margin: 14px 0 22px;
        }

        h2 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            letter-spacing: -0.045em;
            line-height: 1.12;
            margin: 0 0 16px;
        }

        h3 {
            letter-spacing: -0.025em;
            margin: 0 0 8px;
        }

        p {
            color: var(--muted);
            margin: 0 0 18px;
        }

        .hero p {
            font-size: 1.08rem;
            max-width: 560px;
        }

        .hero-img {
            min-height: 390px;
            border-radius: 32px;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            position: relative;
            box-shadow: 0 18px 45px rgba(174, 115, 148, 0.12);
        }

        .photo-note {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(85, 52, 72, 0.72);
            padding: 9px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            backdrop-filter: blur(8px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #b87598;
            color: #fff;
            margin-top: 8px;
            padding: 10px 17px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.92rem;
            transition: 0.25s ease;
            box-shadow: 0 6px 18px rgba(184, 117, 152, 0.18);
        }

        .btn:hover {
            background: #a45e83;
            transform: translateY(-2px);
        }

        .section {
            padding: 48px 0 76px;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-bottom: 26px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(174, 115, 148, 0.06);
            transition: 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 38px rgba(174, 115, 148, 0.12);
        }

        .card .icon {
            width: 20px;
            height: 20px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .card .icon img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block;
        }

        .card p {
            margin-bottom: 0;
        }

        .feature {
            background: #f7e5ee;
            border-radius: 30px;
            padding: 34px;
            margin: 20px 0;
        }

        .feature p {
            color: #8e6d82;
        }

        .tag {
            display: inline-block;
            background: #f9edf3;
            color: #ad6e91;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        ul.clean {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul.clean li {
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
        }

        ul.clean li:last-child {
            border-bottom: 0;
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 28px 0;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        @media (max-width: 780px) {
            .nav {
                align-items: flex-start;
                flex-direction: column;
            }

            .hero {
                grid-template-columns: 1fr;
                padding: 45px 0 30px;
                gap: 26px;
            }

            .hero-img {
                min-height: 290px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .section {
                padding: 35px 0 55px;
            }

            .section-head {
                display: block;
            }
        }

    </style>
</head>
<body>
<header>
    <div class="wrap nav"><a class="brand" href="/"><span class="mark">У</span><span>УЖГОРОД <small
            style="display:block;color:var(--muted);font-size:.65rem;letter-spacing:.13em;font-weight:600">МІСТО НАД УЖЕМ</small></span></a>
        <nav><a class="" href="/">Головна</a><a class="" href="/news">Новини</a><a class=""
                                                                                                      href="/management">Керівництво</a><a
                class="" href="/facts">Факти</a><a class="" href="/contacts">Контакти</a><a class="" href="/history">Історія</a></nav>
    </div>
</header>
<main>
   {% block content %}

{% endblock %}
</main>
<footer>
    <div class="wrap footer-row">© Ужгород · Інформаційний міський сайт
    </div>
</footer>
<script>
    const currentPage = window.location.pathname;

    document.querySelectorAll("nav a").forEach(link => {
        if (link.pathname === currentPage) {
            link.classList.add("active");
        }
    });
</script>
</body>
</html>
